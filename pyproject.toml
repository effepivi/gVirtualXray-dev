[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "scikit-build>=0.15.0",
    "cmake>=3.14",
    #"make"#,
    #"xpecgen",
    #"spekpy@git+https://bitbucket.org/spekpy/spekpy_release.git",
    #"scikit-image",
    #"numpy",
    #"conan>=2.0.0"    
    #"swig; platform_system!='Windows'",
    "ninja"
]
build-backend = "setuptools.build_meta"



[project]
name = "gvxr"
version = "2.0.8"
authors = [
  { name="Dr Franck P. Vidal" }
]
description="gVirtualXray (gVXR) Bindings to simulate realist X-ray attenuation images in microseconds from triangle meshes."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU",
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: C++",
    "Programming Language :: C#",
    "Programming Language :: Java",
    "Programming Language :: Python :: 3",
    "Programming Language :: R",
    "Programming Language :: Ruby",
    "Programming Language :: Tcl",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries"
]

[project.urls]
"Homepage" = "https://gvirtualxray.sourceforge.io/"
"Bug Tracker" = "https://sourceforge.net/p/gvirtualxray/tickets/"
